name: Bug Report
description: Report a bug in a skill or script
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to fill out this bug report.
  - type: input
    id: skill
    attributes:
      label: Affected skill
      description: Which skill is affected?
      placeholder: repo-growth-operator / ecosystem-inclusion-operator
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run '...'
        2. See error
  - type: input
    id: version
    attributes:
      label: Version
      description: SHA or tag
