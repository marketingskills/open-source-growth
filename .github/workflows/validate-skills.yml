name: Validate Skill Metadata

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
  pull_request:
    paths:
      - 'skills/**/SKILL.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run metadata validation
        run: |
          python skills/repo-growth-operator/scripts/validate_skill_metadata.py . || echo "Validation issues found (non-blocking)"
